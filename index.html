<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chan292的主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #bbb;
            margin-bottom: 50px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px 50px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            min-width: 280px;
        }

        .link-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: #f39c12;
        }

        .link-card .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .link-card .title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .link-card .desc {
            font-size: 0.9rem;
            color: #bbb;
        }

        footer {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .link-card {
                min-width: 240px;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">C</div>
        <h1>欢迎来到 Chan292 的网页</h1>
        <p class="subtitle">这里是我的个人主页，分享一些我的数据和项目</p>

        <div class="links">
            <a href="pubg.html" class="link-card">
                <div class="icon">🎮</div>
                <div class="title">PUBG 数据统计</div>
                <div class="desc">绝地求生个人战绩分析</div>
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Chan292. All rights reserved.</p>
    </footer>
</body>
</html>
