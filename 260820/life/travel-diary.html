            font-size: 2.5rem; margin-bottom: 8px;

        .stats {
            display: flex; gap: 30px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center;
        }
        .stat-item {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 12px 24px; backdrop-filter: blur(10px);
        }
        .stat-num { font-size: 1.8rem; font-weight: bold; color: #f39c12; }
        .stat-label { font-size: 0.85rem; color: #999; margin-top: 2px; }
        .legend {
            display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; align-items: center;
        }
        .legend-item {
            display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: #bbb;
        }
        .legend-color {
            width: 22px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.15);
        }
        .legend-dot {
            width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
        }

            background: rgba(255,255,255,0.03); border-radius: 16px;

        @media (max-width: 768px) {

    // ===== 省份名简称转换 =====
    function shortName(name) {
        const suffixes = ['壮族自治区', '回族自治区', '维吾尔自治区', '自治区', '特别行政区', '省', '市'];
        for (const s of suffixes) {
            if (name.endsWith(s)) return name.slice(0, -s.length);
        }
        return name;
    }

    }

    function getProvinceData() {
        return Object.keys(provinceAdcodes).map(function(name) {
            var count = provinceVisits[name] || 0;
            var color = getColor(count);
            return {
                name: name,
                value: count,
                itemStyle: { areaColor: color },
                emphasis: { itemStyle: { areaColor: color } }
            };
        });
    }

    // GeoJSON 多源容错
    var geoSources = [
        'https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/json/china.json',
        'https://unpkg.com/echarts@4.9.0/map/json/china.json',
        'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json'
    ];

    function loadChinaMap() {
        var sourceIndex = 0;
        function tryLoad() {
            var url = geoSources[sourceIndex];
            return fetch(url).then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            }).then(function(json) {
                json.features.forEach(function(f) {
                    f.properties.name = shortName(f.properties.name);
                });
                echarts.registerMap('china', json);
                return json;
            }).catch(function(err) {
                sourceIndex++;
                if (sourceIndex < geoSources.length) {
                    console.warn('源 ' + url + ' 失败，尝试下一个...');
                    return tryLoad();
                }
                throw err;
            });
        }
        return tryLoad();
    }

    // 显示全国视图
    function showChinaView() {
        currentView = 'china';
        currentProvince = null;
        document.getElementById('map-header').style.display = 'none';
        document.getElementById('city-legend').style.display = 'none';

        var mapData = getProvinceData();

        chart.clear();
        chart.setOption({
            tooltip: {
                trigger: 'item',
                formatter: function(params) {
                    const name = params.name;
                    const count = provinceVisits[name] || 0;
                    const cities = visitedCities[name];
                    let html = '<b>' + name + '</b><br/>到访 ' + count + ' 次';
                    if (cities && cities.length) {
                        html += '<br/>到访城市：' + cities.join('、');
                    }
                    return html;
                }
            },
            series: [{
                type: 'map', map: 'china', roam: true, zoom: 1.2,
                scaleLimit: { min: 1, max: 5 },
                center: [105, 36],
                label: { show: false },
                itemStyle: {
                    borderColor: 'rgba(255,255,255,0.2)',
                    borderWidth: 1
                },
                emphasis: {
                    label: { show: true, color: '#f39c12', fontSize: 12, fontWeight: 'bold' }
                },
                select: { disabled: true },
                data: mapData
            }]
        }, true);

        chart.off('click');
        var clickTimer = null;
        chart.on('click', function(params) {
            if (clickTimer) return;
            if (params.componentType === 'series') {
                var name = params.name;
                if (provinceAdcodes[name] !== undefined) {
                    clickTimer = setTimeout(function() { clickTimer = null; }, 500);
                    showProvinceView(name);
                }
            }
        });
    }

    // 显示省份视图（使用中国地图缩放）
    function showProvinceView(provinceName) {
        if (!provinceAdcodes[provinceName]) return;
        currentView = 'province';
        currentProvince = provinceName;
        document.getElementById('map-header').style.display = 'block';
        document.getElementById('province-title').textContent = provinceName;

        var center = provinceCenters[provinceName] || [105, 36];
        var visited = visitedCities[provinceName] || [];
        var cities = cityDatabase[provinceName] || [];
        var visitedData = [];
        var unvisitedData = [];

        cities.forEach(function(c) {
            var name = c[0], lng = c[1], lat = c[2];
            if (visited.includes(name)) {
                visitedData.push({ name: name, value: [lng, lat] });
            } else {
                unvisitedData.push({ name: name, value: [lng, lat] });
            }
        });

        chart.clear();
        chart.setOption({
            tooltip: {
                trigger: 'item',
                formatter: function(params) {
                    if (params.seriesName === '已到访') {
                        return '<b style="color:#f39c12">' + params.name + '</b><br/>已到访';
                    } else if (params.seriesName === '未到访') {
                        return '<b>' + params.name + '</b><br/>未到访';
                    }
                    return params.name;
                }
            },
            geo: {
                map: 'china', roam: true,
                zoom: 4, center: center,
                scaleLimit: { min: 2, max: 8 },
                label: { show: true, color: '#bbb', fontSize: 10 },
                itemStyle: {
                    areaColor: 'rgba(255,255,255,0.05)',
                    borderColor: 'rgba(255,255,255,0.2)',
                    borderWidth: 1
                },
                emphasis: {
                    label: { show: true, color: '#f39c12', fontSize: 12, fontWeight: 'bold' },
                    itemStyle: { areaColor: 'rgba(255,255,255,0.05)' }
                },
                select: { disabled: true },
                regions: [{
                    name: currentProvince,
                    itemStyle: { areaColor: 'rgba(100,149,237,0.4)' },
                    emphasis: { itemStyle: { areaColor: 'rgba(100,149,237,0.4)' } }
                }]
            },
            series: [
            {
                name: '已到访', type: 'scatter', coordinateSystem: 'geo',
                data: visitedData, symbolSize: 12,
                itemStyle: { color: '#f39c12' },
                label: { show: true, position: 'right', color: '#f39c12', fontSize: 11, formatter: '{b}' }
            },
            {
                name: '未到访', type: 'scatter', coordinateSystem: 'geo',
                data: unvisitedData, symbolSize: 8,
                itemStyle: { color: 'rgba(150,150,150,0.5)' },
                label: { show: true, position: 'right', color: '#888', fontSize: 10, formatter: '{b}' }
            }]
        });

        chart.off('click');
        var clickTimer2 = null;
        chart.on('click', function(params) {
            if (clickTimer2) return;
            if (params.componentType === 'geo') {
                var name = params.name;
                if (name && name !== currentProvince && provinceAdcodes[name] !== undefined) {
                    clickTimer2 = setTimeout(function() { clickTimer2 = null; }, 500);
                    showProvinceView(name);
                }
            }
        });
    }

    // 初始化
    loadChinaMap().then(function() {
        showChinaView();
    }).catch(function(err) {
        console.error('加载中国地图失败:', err);
        if (chart) { chart.dispose(); }
        document.getElementById('map-container').innerHTML =
            '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#999;">' +
            '<p style="font-size:1.2rem;margin-bottom:8px;">地图加载失败</p>' +
            '<p style="font-size:0.9rem;">请检查网络连接或刷新页面重试</p></div>';
    });

    window.addEventListener('resize', function() { chart.resize(); });
    </script>
</body>
</html>
