<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG 战绩查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
        }
        
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 16px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .back-link:hover {
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        
        .nav-tab {
            flex: 1;
            padding: 12px 20px;
            text-align: center;
            background: transparent;
            border: none;
            color: #667788;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        
        .nav-tab:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .nav-tab.active {
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
            border: 1px solid rgba(233, 69, 96, 0.4);
        }
        
        /* Page sections */
        .page-section {
            display: none;
        }
        
        .page-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Search Page */
        .search-header {
            text-align: center;
            padding: 40px 0;
            margin-bottom: 30px;
        }
        
        .search-logo {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            margin: 0 auto 20px;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .search-logo img {
            width: 80px;
            height: 80px;
        }
        
        .search-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #e94560;
            margin-bottom: 10px;
        }
        
        .search-subtitle {
            font-size: 1.2rem;
            color: #8899aa;
        }
        
        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .search-input {
            flex: 1;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            font-size: 16px;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            border-color: rgba(233, 69, 96, 0.5);
        }
        
        .search-input::placeholder {
            color: #667788;
        }
        
        .search-btn {
            padding: 16px 32px;
            background: linear-gradient(135deg, #e94560, #c23152);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }
        
        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .search-history {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .history-title {
            font-size: 14px;
            color: #667788;
        }
        
        .history-clear {
            font-size: 14px;
            color: #e94560;
            cursor: pointer;
            background: rgba(233, 69, 96, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            border: none;
            transition: background 0.2s;
        }
        
        .history-clear:hover {
            background: rgba(233, 69, 96, 0.2);
        }
        
        .history-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .history-tag {
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 25px;
            font-size: 14px;
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .history-tag:hover {
            background: rgba(233, 69, 96, 0.15);
            border-color: rgba(233, 69, 96, 0.3);
            color: #e94560;
        }
        
        /* Player Stats Page */
        .player-header {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .player-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            margin-right: 20px;
            border: 3px solid rgba(233, 69, 96, 0.4);
            background: rgba(255, 255, 255, 0.1);
        }
        
        .player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .player-info {
            flex: 1;
        }
        
        .player-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .player-meta {
            font-size: 14px;
            color: #8899aa;
        }
        
        .player-actions {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        
        .action-btn.primary {
            background: rgba(99, 132, 255, 0.2);
            border-color: rgba(99, 132, 255, 0.4);
        }
        
        /* Season Selector */
        .season-selector {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .season-label {
            font-size: 14px;
            color: #8899aa;
        }
        
        .season-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .season-chip {
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 13px;
            color: #8899aa;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .season-chip:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .season-chip.active {
            background: rgba(233, 69, 96, 0.15);
            border-color: rgba(233, 69, 96, 0.4);
            color: #e94560;
            font-weight: 600;
        }
        
        /* Mode Tabs */
        .mode-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .mode-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid transparent;
            border-radius: 12px;
            font-size: 14px;
            color: #667788;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .mode-tab:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .mode-tab.active {
            background: rgba(233, 69, 96, 0.15);
            color: #e94560;
            border-color: rgba(233, 69, 96, 0.4);
            font-weight: 600;
        }
        
        .mode-tab.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        /* Radar Chart */
        .radar-section {
            margin-bottom: 24px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #e94560;
            margin-bottom: 12px;
        }
        
        .radar-container {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }
        
        .radar-canvas {
            max-width: 100%;
            height: 300px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
        }
        
        .stat-card.accent {
            border-color: rgba(233, 69, 96, 0.3);
        }
        
        .stat-card.highlight {
            background: rgba(233, 69, 96, 0.12);
            border-color: rgba(233, 69, 96, 0.4);
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
        }
        
        .stat-card.highlight .stat-value {
            color: #e94560;
            font-size: 28px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #667788;
        }
        
        /* Detail Table */
        .detail-section {
            margin-bottom: 24px;
        }
        
        .detail-table {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .table-row {
            display: flex;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        
        .table-row:last-child {
            border-bottom: none;
        }
        
        .table-row.header {
            background: rgba(233, 69, 96, 0.1);
            font-weight: 600;
        }
        
        .col-1 {
            flex: 1;
            font-size: 14px;
            color: #8899aa;
        }
        
        .col-2 {
            flex: 1;
            font-size: 14px;
            text-align: right;
            font-weight: 500;
        }
        
        .table-row.header .col {
            color: #e94560;
        }
        
        /* Compare Page */
        .compare-form {
            margin-bottom: 30px;
        }
        
        .player-input-group {
            display: flex;
            align-items: stretch;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .player-slot {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .slot-label {
            font-size: 13px;
            color: #8899aa;
            padding-left: 8px;
        }
        
        .slot-input {
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            font-size: 15px;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .slot-input:focus {
            border-color: rgba(233, 69, 96, 0.5);
        }
        
        .slot1 .slot-input {
            border-color: rgba(233, 69, 96, 0.3);
        }
        
        .slot2 .slot-input {
            border-color: rgba(99, 132, 255, 0.3);
        }
        
        .vs-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }
        
        .vs-text {
            font-size: 20px;
            font-weight: 700;
            color: #e94560;
            font-style: italic;
        }
        
        .compare-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e94560, #c23152);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .compare-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }
        
        .compare-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Compare Results */
        .result-header {
            display: flex;
            align-items: stretch;
            gap: 15px;
            margin-bottom: 24px;
        }
        
        .result-player {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px 15px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .result-player1 {
            border-color: rgba(233, 69, 96, 0.3);
        }
        
        .result-player2 {
            border-color: rgba(99, 132, 255, 0.3);
        }
        
        .result-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .result-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .result-name {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .result-season {
            font-size: 12px;
            color: #8899aa;
        }
        
        .vs-middle {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }
        
        .vs-big {
            font-size: 28px;
            font-weight: 700;
            color: #e94560;
            font-style: italic;
        }
        
        .vs-mode {
            font-size: 12px;
            color: #8899aa;
            margin-top: 4px;
        }
        
        /* Compare Table */
        .compare-table {
            margin-bottom: 24px;
        }
        
        .compare-row {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        
        .compare-row:last-child {
            border-bottom: none;
        }
        
        .compare-cell {
            flex: 1;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        
        .compare-cell.winner {
            background: rgba(46, 204, 113, 0.15);
        }
        
        .compare-cell.loser {
            background: rgba(255, 255, 255, 0.02);
        }
        
        .cell-value {
            font-size: 18px;
            font-weight: 700;
            display: block;
        }
        
        .compare-cell.winner .cell-value {
            color: #2ecc71;
        }
        
        .compare-label {
            width: 100px;
            text-align: center;
            font-size: 13px;
            color: #8899aa;
        }
        
        /* Loading & Error States */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 0;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 16px;
            color: #8899aa;
        }
        
        .error-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 0;
        }
        
        .error-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        .error-text {
            font-size: 16px;
            color: #e94560;
            margin-bottom: 24px;
            text-align: center;
            max-width: 400px;
        }
        
        .retry-btn {
            padding: 12px 30px;
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid #e94560;
            color: #e94560;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .retry-btn:hover {
            background: rgba(233, 69, 96, 0.3);
        }
        
        .empty-mode {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 0;
        }
        
        .empty-title {
            font-size: 18px;
            color: #e94560;
            margin-bottom: 10px;
        }
        
        .empty-desc {
            font-size: 14px;
            color: #8899aa;
        }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 30px 0;
            color: #445566;
            font-size: 13px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .search-title {
                font-size: 2rem;
            }
            
            .search-box {
                flex-direction: column;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .player-input-group {
                flex-direction: column;
            }
            
            .vs-divider {
                padding: 10px 0;
            }
            
            .result-header {
                flex-direction: column;
            }
            
            .mode-tabs {
                flex-wrap: wrap;
            }
            
            .mode-tab {
                flex: 1 1 calc(50% - 6px);
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← 返回主页</a>
    
    <div class="container">
        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchPage('search')">🔍 玩家查询</button>
            <button class="nav-tab" onclick="switchPage('stats')">📊 战绩详情</button>
            <button class="nav-tab" onclick="switchPage('compare')">⚔️ 战绩对比</button>
        </div>
        
        <!-- Search Page -->
        <div id="page-search" class="page-section active">
            <div class="search-header">
                <div class="search-logo">
                    <img src="https://wstatic-prod.pubg.com/web/live/static/favicons/apple-icon-180x180.png" alt="PUBG Logo">
                </div>
                <h1 class="search-title">PUBG 战绩查询</h1>
                <p class="search-subtitle">查询玩家赛季数据</p>
            </div>
            
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="输入 Steam 玩家名称" onkeypress="if(event.key==='Enter')searchPlayer()">
                <button class="search-btn" id="searchBtn" onclick="searchPlayer()">查询</button>
            </div>
            
            <div class="search-history" id="searchHistory">
                <div class="history-header">
                    <span class="history-title">历史记录：</span>
                    <button class="history-clear" onclick="clearHistory()">清空</button>
                </div>
                <div class="history-tags" id="historyTags"></div>
            </div>
        </div>
        
        <!-- Player Stats Page -->
        <div id="page-stats" class="page-section">
            <div id="statsLoading" class="loading" style="display:none;">
                <div class="loading-spinner"></div>
                <span class="loading-text">正在获取数据...</span>
            </div>
            
            <div id="statsError" class="error-box" style="display:none;">
                <div class="error-icon">⚠️</div>
                <div class="error-text" id="statsErrorText"></div>
                <button class="retry-btn" onclick="retryStats()">重新查询</button>
            </div>
            
            <div id="statsContent" style="display:none;">
                <div class="player-header">
                    <div class="player-avatar">
                        <img id="playerAvatar" src="https://wstatic-prod.pubg.com/web/live/static/favicons/apple-icon-180x180.png" alt="Avatar">
                    </div>
                    <div class="player-info">
                        <div class="player-name" id="playerName"></div>
                        <div class="player-meta" id="playerMeta"></div>
                    </div>
                    <div class="player-actions">
                        <button class="action-btn primary" onclick="goCompare()">对比</button>
                    </div>
                </div>
                
                <div class="season-selector" id="seasonSelector" style="display:none;">
                    <span class="season-label">赛季：</span>
                    <div class="season-chips" id="seasonChips"></div>
                </div>
                
                <div class="mode-tabs">
                    <div class="mode-tab" data-mode="solo" onclick="switchMode('solo')">单人</div>
                    <div class="mode-tab" data-mode="duo" onclick="switchMode('duo')">双人</div>
                    <div class="mode-tab active" data-mode="squad" onclick="switchMode('squad')">四人</div>
                </div>
                
                <div id="emptyMode" class="empty-mode" style="display:none;">
                    <div class="empty-title">暂无该模式数据</div>
                    <div class="empty-desc">请切换到其他模式，或稍后重试查询</div>
                </div>
                
                <div id="modeContent">
                    <div class="radar-section">
                        <div class="section-title">能力雷达</div>
                        <div class="radar-container">
                            <canvas id="radarCanvas" class="radar-canvas" width="500" height="300"></canvas>
                        </div>
                    </div>
                    
                    <div class="stats-grid" id="statsGrid"></div>
                    
                    <div class="detail-section">
                        <div class="section-title">详细数据</div>
                        <div class="detail-table" id="detailTable"></div>
                    </div>
                </div>

    <script>
        // Configuration
        const API_BASE = 'http://localhost:3000';
        const CACHE_TTL = 10 * 60 * 1000;
        
        // State
        let currentPage = 'search';
        let currentMode = 'squad';
        let compareMode = 'squad';
        let playerData = null;
        let player1Data = null;
        let player2Data = null;
        let currentSeason = '';
        let seasons = [];
        let currentStats = {};
        
        // Cache helpers
        function getCache(key) {
            try {
                const cache = localStorage.getItem(key);
                if (cache) {
                    const parsed = JSON.parse(cache);
                    if (Date.now() - parsed.timestamp < CACHE_TTL) return parsed.data;
                }
            } catch(e) {}
            return null;
        }
        
        function setCache(key, data) {
            try {
                localStorage.setItem(key, JSON.stringify({ data, timestamp: Date.now() }));
            } catch(e) {}
        }
        
        // History management
        function getHistory() {
            try {
                return JSON.parse(localStorage.getItem('pubg_search_history') || '[]');
            } catch(e) { return []; }
        }
        
        function saveToHistory(name) {
            let list = getHistory();
            list = list.filter(item => item !== name);
            list.unshift(name);
            if (list.length > 10) list = list.slice(0, 10);
            localStorage.setItem('pubg_search_history', JSON.stringify(list));
            renderHistory();
        }
        
        function clearHistory() {
            localStorage.removeItem('pubg_search_history');
            renderHistory();
        }
        
        function renderHistory() {
            const history = getHistory();
            const container = document.getElementById('historyTags');
            const historySection = document.getElementById('searchHistory');
            
            if (history.length === 0) {
                historySection.style.display = 'none';
                return;
            }
            
            historySection.style.display = 'block';
            container.innerHTML = history.map(name => 
                `<div class="history-tag" onclick="quickSearch('${name}')">${name}</div>`
            ).join('');
        }
        
        function quickSearch(name) {
            document.getElementById('searchInput').value = name;
            searchPlayer();
        }
        
        // Page navigation
        function switchPage(page) {
            currentPage = page;
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + page).classList.add('active');
            document.querySelectorAll('.nav-tab')[['search', 'stats', 'compare'].indexOf(page)].classList.add('active');
        }
        
        // Search player
        async function searchPlayer() {
            const name = document.getElementById('searchInput').value.trim();
            if (!name) {
                alert('请输入玩家名称');
                return;
            }
            
            saveToHistory(name);
            switchPage('stats');
            await fetchPlayerData(name);
        }
        
        // Fetch player data
        async function fetchPlayerData(name, season) {
            const statsLoading = document.getElementById('statsLoading');
            const statsError = document.getElementById('statsError');
            const statsContent = document.getElementById('statsContent');
            
            statsLoading.style.display = 'flex';
            statsError.style.display = 'none';
            statsContent.style.display = 'none';
            
            // Try to fetch seasons first
            try {
                const seasonsCacheKey = 'seasons_' + name;
                let cachedSeasons = getCache(seasonsCacheKey);
                
                if (!cachedSeasons) {
                    const seasonsRes = await fetch(`${API_BASE}/api/player/${encodeURIComponent(name)}/seasons`);
                    if (seasonsRes.ok) {
                        const seasonsData = await seasonsRes.json();
                        cachedSeasons = seasonsData.seasons || [];
                        setCache(seasonsCacheKey, cachedSeasons);
                    }
                }
                
                if (cachedSeasons && cachedSeasons.length > 0) {
                    seasons = cachedSeasons;
                    currentSeason = season || seasons[0].id;
                    renderSeasonSelector();
                }
            } catch(e) {
                console.log('Failed to fetch seasons:', e);
            }
            
            // Fetch player data
            const cacheKey = 'player_' + name + '_' + (currentSeason || 'latest');
            let cachedData = getCache(cacheKey);
            
            if (cachedData) {
                playerData = cachedData;
                renderPlayerData();
                return;
            }
            
            try {
                const url = `${API_BASE}/api/player/${encodeURIComponent(name)}${currentSeason ? '?season=' + encodeURIComponent(currentSeason) : ''}`;
                const res = await fetch(url);
                
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error || errData.message || '获取数据失败');
                }
                
                const data = await res.json();
                if (data.modes) {
                    playerData = data;
                    setCache(cacheKey, data);
                    renderPlayerData();
                } else {
                    throw new Error('数据格式错误');
                }
            } catch(e) {
                console.error('Fetch error:', e);
                statsLoading.style.display = 'none';
                statsError.style.display = 'flex';
                document.getElementById('statsErrorText').textContent = e.message || '网络请求失败，请检查网络或代理服务器';
                // Load demo data as fallback
                loadDemoData();
            }
        }
        
        function renderSeasonSelector() {
            if (seasons.length <= 1) {
                document.getElementById('seasonSelector').style.display = 'none';
                return;
            }
            
            document.getElementById('seasonSelector').style.display = 'flex';
            const container = document.getElementById('seasonChips');
            container.innerHTML = seasons.map(s => 
                `<div class="season-chip ${s.id === currentSeason ? 'active' : ''}" onclick="switchSeason('${s.id}')">${s.name}</div>`
            ).join('');
        }
        
        function switchSeason(seasonId) {
            currentSeason = seasonId;
            const name = playerData?.name || document.getElementById('searchInput').value.trim();
            if (name) fetchPlayerData(name, seasonId);
        }
        
        function renderPlayerData() {
            const statsLoading = document.getElementById('statsLoading');
            const statsError = document.getElementById('statsError');
            const statsContent = document.getElementById('statsContent');
            
            statsLoading.style.display = 'none';
            statsError.style.display = 'none';
            statsContent.style.display = 'block';
            
            document.getElementById('playerAvatar').src = playerData.avatar || 'https://wstatic-prod.pubg.com/web/live/static/favicons/apple-icon-180x180.png';
            document.getElementById('playerName').textContent = playerData.name;
            document.getElementById('playerMeta').textContent = `等级 ${playerData.level || 'N/A'} · ${playerData.seasonName || '最新赛季'}`;
            document.getElementById('footerPlayerName').textContent = playerData.name;
            
            // Set default mode
            const modes = playerData.modes || {};
            const defaultMode = modes.squad ? 'squad' : (modes.duo ? 'duo' : 'solo');
            switchMode(defaultMode);
        }
        
        function switchMode(mode) {
            currentMode = mode;
            const modes = playerData?.modes || {};
            
            // Update tabs
            document.querySelectorAll('#page-stats .mode-tab').forEach(tab => {
                const tabMode = tab.dataset.mode;
                tab.classList.toggle('active', tabMode === mode);
                tab.classList.toggle('disabled', !modes[tabMode]);
            });
            
            if (!modes[mode]) {
                document.getElementById('emptyMode').style.display = 'flex';
                document.getElementById('modeContent').style.display = 'none';
                return;
            }
            
            document.getElementById('emptyMode').style.display = 'none';
            document.getElementById('modeContent').style.display = 'block';
            
            const modeData = modes[mode];
            currentStats = {
                matches: modeData.roundsPlayed ?? 0,
                wins: modeData.wins ?? 0,
                top10: modeData.top10s ?? 0,
                kdRatio: modeData.kdRatio ?? '0',
                kills: modeData.kills ?? 0,
                deaths: modeData.deaths ?? 0,
                assists: modeData.assists ?? 0,
                adr: modeData.adr ?? '0',
                winRate: modeData.winRate ?? '0',
                top10Rate: modeData.top10Rate ?? '0',
                avgRank: modeData.avgRank ?? '-',
                avgDamage: modeData.avgDamage ?? '0',
                revives: modeData.revives ?? 0
            };
            
            renderStatsGrid();
            renderDetailTable(modeData);
            drawRadarChart(currentStats);
        }
        
        function renderStatsGrid() {
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = `
                <div class="stat-card accent"><div class="stat-value">${currentStats.matches}</div><div class="stat-label">场次</div></div>
                <div class="stat-card"><div class="stat-value">${currentStats.wins}</div><div class="stat-label">吃鸡</div></div>
                <div class="stat-card"><div class="stat-value">${currentStats.top10}</div><div class="stat-label">前10</div></div>
                <div class="stat-card highlight"><div class="stat-value">${currentStats.kdRatio}</div><div class="stat-label">K/D</div></div>
                <div class="stat-card"><div class="stat-value">${currentStats.kills}</div><div class="stat-label">淘汰</div></div>
                <div class="stat-card"><div class="stat-value">${currentStats.deaths}</div><div class="stat-label">死亡</div></div>
                <div class="stat-card"><div class="stat-value">${currentStats.assists}</div><div class="stat-label">助攻</div></div>

                <div class="stat-card"><div class="stat-value">${currentStats.avgRank}</div><div class="stat-label">平均排名</div></div>

        function renderDetailTable(modeData) {
            const table = document.getElementById('detailTable');
            const details = [
                { label: '场次', value: modeData.roundsPlayed ?? 0 },
                { label: '吃鸡', value: modeData.wins ?? 0 },

                { label: '平均排名', value: modeData.avgRank ?? '-' },

                { label: '救援', value: modeData.revives ?? 0 },
                { label: '治疗', value: modeData.heals ?? 0 },

                { label: '队友击杀', value: modeData.teamKills ?? 0 },

                { label: '步行距离', value: (modeData.walkDistance ?? 0) + 'm' },
                { label: '载具距离', value: (modeData.rideDistance ?? 0) + 'm' },
                { label: '游泳距离', value: (modeData.swimDistance ?? 0) + 'm' },
                { label: '武器获取', value: modeData.weaponsAcquired ?? 0 }
            ];
            
            table.innerHTML = `
                <div class="table-row header"><span class="col col-1">指标</span><span class="col col-2">数值</span></div>
                ${details.map(d => `<div class="table-row"><span class="col col-1">${d.label}</span><span class="col col-2">${d.value}</span></div>`).join('')}
            `;
        }
        
        function drawRadarChart(stats) {
            const canvas = document.getElementById('radarCanvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) / 2 - 50;
            
            const labels = ['胜率', 'K/D', 'ADR', '救援', '平均排名'];
            const avgRank = parseFloat(stats.avgRank) || 25;
            const values = [
                parseFloat(stats.winRate) || 0,
                parseFloat(stats.kdRatio) || 0,
                parseFloat(stats.adr) || 0,
                stats.revives || 0,
                25 - avgRank
            ];
            const maxValues = [20, 5, 400, 60, 24];
            const normalizedValues = values.map((v, i) => Math.min(v / maxValues[i], 1));
            
            const angles = [];
            for (let i = 0; i < 5; i++) {
                angles.push((Math.PI * 2 * i) / 5 - Math.PI / 2);
            }
            
            ctx.clearRect(0, 0, width, height);
            
            // Draw grid
            for (let level = 1; level <= 5; level++) {
                const r = (radius * level) / 5;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const x = centerX + r * Math.cos(angles[i]);
                    const y = centerY + r * Math.sin(angles[i]);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            // Draw axes
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + radius * Math.cos(angles[i]), centerY + radius * Math.sin(angles[i]));
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            // Draw data area
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const r = radius * normalizedValues[i];
                const x = centerX + r * Math.cos(angles[i]);
                const y = centerY + r * Math.sin(angles[i]);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = 'rgba(233, 69, 96, 0.25)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(233, 69, 96, 0.8)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Draw data points
            for (let i = 0; i < 5; i++) {
                const r = radius * normalizedValues[i];
                const x = centerX + r * Math.cos(angles[i]);
                const y = centerY + r * Math.sin(angles[i]);
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#e94560';
                ctx.fill();
            }
            
            // Draw labels
            ctx.font = '13px sans-serif';
            ctx.fillStyle = '#8899aa';
            ctx.textAlign = 'center';
            for (let i = 0; i < 5; i++) {
                const labelR = radius + 30;
                const x = centerX + labelR * Math.cos(angles[i]);
                let y = centerY + labelR * Math.sin(angles[i]);
                if (i === 0) y -= 5;
                else if (i === 4) y += 5;
                ctx.fillText(labels[i], x, y);
            }
        }

        function retryStats() {

        function goCompare() {
            if (playerData?.name) {
                document.getElementById('compareInput1').value = playerData.name;

        // Compare functionality
        async function doCompare() {
            const p1 = document.getElementById('compareInput1').value.trim();
            const p2 = document.getElementById('compareInput2').value.trim();
            
            if (!p1 || !p2) {
                alert('请输入两个玩家名称');
                return;
            }
            if (p1 === p2) {
                alert('请选择不同的玩家');
                return;
            }
            
            saveToHistory(p1);
            saveToHistory(p2);
            
            document.getElementById('compareLoading').style.display = 'flex';
            document.getElementById('compareError').style.display = 'none';
            document.getElementById('compareResults').style.display = 'none';
            
            try {
                const [data1, data2] = await Promise.all([
                    fetchPlayerForCompare(p1),
                    fetchPlayerForCompare(p2)
                ]);
                
                player1Data = data1;
                player2Data = data2;
                renderCompareResults();
            } catch(e) {
                document.getElementById('compareLoading').style.display = 'none';
                document.getElementById('compareError').style.display = 'flex';
                document.getElementById('compareErrorText').textContent = e.message || '获取数据失败';
            }
        }
        
        async function fetchPlayerForCompare(name) {
            const cacheKey = 'player_' + name;
            const cached = getCache(cacheKey);
            if (cached) return cached;
            
            try {
                const res = await fetch(`${API_BASE}/api/player/${encodeURIComponent(name)}`);
                if (!res.ok) throw new Error('获取失败');
                const data = await res.json();
                if (data.modes) {
                    setCache(cacheKey, data);
                    return data;
                }
                throw new Error('数据格式错误');
            } catch(e) {
                // Return demo data
                return {
                    name: name,
                    avatar: 'https://wstatic-prod.pubg.com/web/live/static/favicons/apple-icon-180x180.png',
                    level: 268,
                    seasonName: 'Demo',
                    modes: {
                        solo: { roundsPlayed: 45, wins: 3, top10s: 12, kills: 98, deaths: 42, assists: 15, kdRatio: '2.33', adr: '185.6', winRate: '6.7', top10Rate: '26.7', avgRank: '18.4', revives: 12, headshotKills: 25, dBNOs: 30 },
                        duo: { roundsPlayed: 128, wins: 15, top10s: 48, kills: 325, deaths: 113, assists: 67, kdRatio: '2.88', adr: '215.3', winRate: '11.7', top10Rate: '37.5', avgRank: '12.8', revives: 45, headshotKills: 85, dBNOs: 120 },
                        squad: { roundsPlayed: 256, wins: 38, top10s: 112, kills: 689, deaths: 218, assists: 156, kdRatio: '3.16', adr: '245.8', winRate: '14.8', top10Rate: '43.8', avgRank: '9.6', revives: 98, headshotKills: 175, dBNOs: 280 }
                    }
                };
            }
        }
        
        function renderCompareResults() {
            document.getElementById('compareLoading').style.display = 'none';

            document.getElementById('compareAvatar1').src = player1Data.avatar || 'https://wstatic-prod.pubg.com/web/live/static/favicons/apple-icon-180x180.png';
            document.getElementById('compareAvatar2').src = player2Data.avatar || 'https://wstatic-prod.pubg.com/web/live/static/favicons/apple-icon-180x180.png';
            document.getElementById('compareName1').textContent = player1Data.name;
            document.getElementById('compareName2').textContent = player2Data.name;
            document.getElementById('compareSeason1').textContent = player1Data.seasonName || '';
            document.getElementById('compareSeason2').textContent = player2Data.seasonName || '';
            document.getElementById('legendName1').textContent = player1Data.name;
            document.getElementById('legendName2').textContent = player2Data.name;
            
            updateCompareStats();
        }
        
        function switchCompareMode(mode) {
            compareMode = mode;
            document.querySelectorAll('#page-compare .mode-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.mode === mode);
            });
            document.getElementById('compareModeLabel').textContent = mode === 'squad' ? '四人' : (mode === 'duo' ? '双人' : '单人');
            if (player1Data && player2Data) updateCompareStats();
        }
        
        function updateCompareStats() {
            const p1Stats = player1Data?.modes?.[compareMode] || {};
            const p2Stats = player2Data?.modes?.[compareMode] || {};
            
            const stats = [
                { label: '场次', key: 'roundsPlayed' },
                { label: '吃鸡', key: 'wins' },
                { label: '前10', key: 'top10s' },
                { label: 'K/D', key: 'kdRatio' },
                { label: '淘汰', key: 'kills' },
                { label: '死亡', key: 'deaths', invert: true },
                { label: '助攻', key: 'assists' },
                { label: '胜率', key: 'winRate', suffix: '%' },
                { label: 'ADR', key: 'adr' },
                { label: '平均排名', key: 'avgRank', invert: true },
                { label: '救援', key: 'revives' },
                { label: '爆头击杀', key: 'headshotKills' },
                { label: '击倒', key: 'dBNOs' }
            ];
            
            const table = document.getElementById('compareTable');
            table.innerHTML = stats.map(s => {
                const v1 = parseFloat(p1Stats[s.key] ?? 0) || 0;
                const v2 = parseFloat(p2Stats[s.key] ?? 0) || 0;
                let p1Winner = v1 > v2;
                if (s.invert) p1Winner = v1 < v2;
                if (v1 === v2) p1Winner = null;
                
                const v1Display = s.suffix ? (v1 + s.suffix) : v1;
                const v2Display = s.suffix ? (v2 + s.suffix) : v2;
                
                return `
                    <div class="compare-row">
                        <div class="compare-cell ${p1Winner === true ? 'winner' : (p1Winner === false ? 'loser' : '')}">
                            <span class="cell-value">${v1Display}</span>
                        </div>
                        <span class="compare-label">${s.label}</span>
                        <div class="compare-cell ${p1Winner === false ? 'winner' : (p1Winner === true ? 'loser' : '')}">
                            <span class="cell-value">${v2Display}</span>
                        </div>
                    </div>
                `;
            }).join('');
            
            drawCompareRadar(p1Stats, p2Stats);
        }
        
        function drawCompareRadar(p1Stats, p2Stats) {
            const canvas = document.getElementById('compareRadarCanvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) / 2 - 60;
            
            const labels = ['胜率', 'K/D', 'ADR', '救援', '平均排名'];
            
            const getValues = (stats) => {
                const avgRank = parseFloat(stats.avgRank) || 25;
                return [
                    parseFloat(stats.winRate) || 0,
                    parseFloat(stats.kdRatio) || 0,
                    parseFloat(stats.adr) || 0,
                    stats.revives || 0,
                    25 - avgRank
                ];
            };
            
            const p1Values = getValues(p1Stats);
            const p2Values = getValues(p2Stats);
            const maxValues = [20, 5, 400, 60, 24];
            
            const normalize = (values) => values.map((v, i) => Math.min(v / maxValues[i], 1));
            const p1Normalized = normalize(p1Values);
            const p2Normalized = normalize(p2Values);
            
            const angles = [];
            for (let i = 0; i < 5; i++) {
                angles.push((Math.PI * 2 * i) / 5 - Math.PI / 2);
            }
            
            ctx.clearRect(0, 0, width, height);
            
            // Draw grid
            for (let level = 1; level <= 5; level++) {
                const r = (radius * level) / 5;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const x = centerX + r * Math.cos(angles[i]);
                    const y = centerY + r * Math.sin(angles[i]);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            // Draw axes
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + radius * Math.cos(angles[i]), centerY + radius * Math.sin(angles[i]));
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            // Draw player 1 area (red)
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const r = radius * p1Normalized[i];
                const x = centerX + r * Math.cos(angles[i]);
                const y = centerY + r * Math.sin(angles[i]);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = 'rgba(233, 69, 96, 0.2)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(233, 69, 96, 0.8)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Draw player 2 area (blue)
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const r = radius * p2Normalized[i];
                const x = centerX + r * Math.cos(angles[i]);
                const y = centerY + r * Math.sin(angles[i]);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = 'rgba(99, 132, 255, 0.2)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(99, 132, 255, 0.8)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Draw player 1 points
            for (let i = 0; i < 5; i++) {
                const r = radius * p1Normalized[i];
                const x = centerX + r * Math.cos(angles[i]);
                const y = centerY + r * Math.sin(angles[i]);
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#e94560';
                ctx.fill();
            }
            
            // Draw player 2 points
            for (let i = 0; i < 5; i++) {
                const r = radius * p2Normalized[i];
                const x = centerX + r * Math.cos(angles[i]);
                const y = centerY + r * Math.sin(angles[i]);
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#6384ff';
                ctx.fill();
            }
            
            // Draw labels
            ctx.font = '13px sans-serif';
            ctx.fillStyle = '#8899aa';
            ctx.textAlign = 'center';
            for (let i = 0; i < 5; i++) {
                const labelR = radius + 35;
                const x = centerX + labelR * Math.cos(angles[i]);
                let y = centerY + labelR * Math.sin(angles[i]);
                if (i === 0) y -= 5;
                else if (i === 4) y += 5;
                ctx.fillText(labels[i], x, y);
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            renderHistory();
        });
    </script>
</body>
</html>
