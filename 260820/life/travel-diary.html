<html lang="zh-CN">
<head>

    <title>踏足过的地方</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }
        .back-link {
            position: absolute; top: 20px; left: 20px; color: #f39c12;
            text-decoration: none; font-size: 1rem; transition: color 0.3s;
        }
        .back-link:hover { color: #e74c3c; }
        .container {
            text-align: center; padding: 40px 20px; flex: 1;
            display: flex; flex-direction: column; align-items: center; max-width: 1200px; width: 100%;
        }
        h1 {
            font-size: 2.5rem; margin-bottom: 8px;
            background: linear-gradient(90deg, #f39c12, #e74c3c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .subtitle { font-size: 1.1rem; color: #bbb; margin-bottom: 20px; }
        .stats {
            display: flex; gap: 30px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center;
        }
        .stat-item {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 12px 24px; backdrop-filter: blur(10px);
        }
        .stat-num { font-size: 1.8rem; font-weight: bold; color: #f39c12; }
        .stat-label { font-size: 0.85rem; color: #999; margin-top: 2px; }
        .legend {
            display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; align-items: center;
        }
        .legend-item {
            display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: #bbb;
        }
        .legend-color {
            width: 22px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.15);
        }
        .legend-dot {
            width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
        }
        #map-container {
            width: 100%; max-width: 960px; height: 600px;
            background: rgba(255,255,255,0.03); border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08); position: relative;
        }
        .city-legend {
            display: none; gap: 20px; margin-top: 10px; justify-content: center; align-items: center;
        }
        .city-legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #bbb; }
        .trip-list { display: none !important; }
        footer { width: 100%; text-align: center; color: #666; font-size: 0.9rem; padding: 30px 0; }
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            #map-container { height: 400px; }
            .stats { gap: 15px; }
            .stat-item { padding: 8px 16px; }
            .stat-num { font-size: 1.4rem; }
            .legend { gap: 4px; }
            .legend-item { font-size: 0.7rem; }
            .legend-color { width: 16px; height: 10px; }
        }
    </style>
</head>
