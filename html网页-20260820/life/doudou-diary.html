<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆豆日记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 800px;
            width: 100%;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #f39c12;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #e74c3c;
        }

        .diary-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #bbb;
            margin-bottom: 50px;
            line-height: 1.6;
        }

        .content-placeholder {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 40px;
            margin-top: 30px;
            backdrop-filter: blur(10px);
        }

        .content-placeholder p {
            color: #999;
            font-style: italic;
        }

        footer {
            width: 100%;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            padding: 30px 0;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 1.1rem;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">← 返回主页</a>
    
    <div class="container">
        <div class="diary-icon">📖</div>
        <h1>豆豆日记</h1>
        <p class="subtitle">这里记录的是豆豆的成长生活</p>
        
        <div class="content-placeholder">
            <p>日记内容将在这里展示...</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Chan292. All rights reserved.</p>
    </footer>
</body>
</html>
